name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable and installer
        run: npm run dist
        env:
          # No signing certificate in CI; and the winCodeSign cache contains
          # macOS symlinks that need privileges Windows runners may not have.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
