<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowMark</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="titlebar">
    <div id="titlebar-menus">
      <!-- File menu -->
      <div class="menu-item-dropdown">
        <button class="topbar-menu-btn" id="file-menu-btn">File</button>
        <div id="file-dropdown" class="dropdown-menu hidden">
          <button data-action="new">New File <span class="shortcut">Ctrl+N</span></button>
          <button data-action="open">Open File <span class="shortcut">Ctrl+O</span></button>
          <button data-action="quickOpen">Quick Open <span class="shortcut">Ctrl+P</span></button>
          <button data-action="save">Save <span class="shortcut">Ctrl+S</span></button>
          <button data-action="saveAs">Save As <span class="shortcut">Ctrl+Shift+S</span></button>
          <button data-action="closeTab">Close Tab <span class="shortcut">Ctrl+W</span></button>
          <div class="menu-divider"></div>
          <button data-action="exportPDF">Export PDF</button>
          <button data-action="exportHTML">Export HTML</button>
          <div class="menu-divider"></div>
          <button data-action="settings">Settings <span class="shortcut">Theme &amp; Colors</span></button>
          <button data-action="zen">Distraction-free <span class="shortcut">F11</span></button>
        </div>
      </div>

      <!-- Edit menu -->
      <div class="menu-item-dropdown">
        <button class="topbar-menu-btn" id="edit-menu-btn">Edit</button>
        <div id="edit-dropdown" class="dropdown-menu hidden">
          <button data-action="edit:undo">Undo <span class="shortcut">Ctrl+Z</span></button>
          <button data-action="edit:redo">Redo <span class="shortcut">Ctrl+Y</span></button>
          <div class="menu-divider"></div>
          <button data-action="edit:cut">Cut <span class="shortcut">Ctrl+X</span></button>
          <button data-action="edit:copy">Copy <span class="shortcut">Ctrl+C</span></button>
          <button data-action="edit:paste">Paste <span class="shortcut">Ctrl+V</span></button>
          <button data-action="edit:selectAll">Select All <span class="shortcut">Ctrl+A</span></button>
          <div class="menu-divider"></div>
          <button data-action="edit:find">Find &amp; Replace <span class="shortcut">Ctrl+F</span></button>
        </div>
      </div>

      <!-- Insert menu -->
      <div class="menu-item-dropdown">
        <button class="topbar-menu-btn" id="insert-menu-btn">Insert</button>
        <div id="insert-dropdown" class="dropdown-menu hidden">
          <button data-action="insert:bold">Bold <span class="shortcut">Ctrl+B</span></button>
          <button data-action="insert:italic">Italic <span class="shortcut">Ctrl+I</span></button>
          <button data-action="insert:strikethrough">Strikethrough <span class="shortcut">Ctrl+Shift+X</span></button>
          <button data-action="insert:inlineCode">Inline Code <span class="shortcut">Ctrl+`</span></button>
          <button data-action="insert:codeBlock">Code Block <span class="shortcut">Ctrl+Shift+C</span></button>
          <div class="menu-divider"></div>
          <button data-action="insert:link">Link <span class="shortcut">Ctrl+K</span></button>
          <button data-action="insert:image">Image <span class="shortcut">Ctrl+Shift+I</span></button>
          <div class="menu-divider"></div>
          <button data-action="insert:table">Table</button>
          <button data-action="insert:callout">Callout</button>
          <div class="menu-divider"></div>
          <button data-action="insert:mathInline">Math (Inline) <span class="shortcut">Ctrl+Shift+M</span></button>
          <button data-action="insert:mathBlock">Math (Block)</button>
          <button data-action="insert:footnote">Footnote</button>
          <div class="menu-divider"></div>
          <button data-action="insert:hr">Horizontal Rule</button>
          <button data-action="insert:quote">Quote</button>
          <button data-action="insert:taskList">Task List</button>
          <div class="menu-divider"></div>
          <button data-action="insert:heading1">Heading 1</button>
          <button data-action="insert:heading2">Heading 2</button>
          <button data-action="insert:heading3">Heading 3</button>
        </div>
      </div>
    </div>

    <!-- Tabs strip directly on topbar -->
    <div id="tabbar"></div>

    <div id="window-controls">
      <button id="btn-min"   title="Minimize">&#8211;</button>
      <button id="btn-max"   title="Maximize">&#9633;</button>
      <button id="btn-close" title="Close">&#10005;</button>
    </div>
  </div>

  <!-- Custom confirm dialog -->
  <div id="confirm-overlay" class="hidden">
    <div id="confirm-box">
      <div id="confirm-message"></div>
      <div id="confirm-buttons">
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-ok"></button>
      </div>
    </div>
  </div>

  <!-- Settings panel -->
  <div id="settings-panel" class="hidden">
    <div id="settings-box">
      <div class="settings-heading">Base Theme</div>
      <div id="theme-options">
        <button class="theme-opt" data-theme="theme-dark">Dark</button>
        <button class="theme-opt" data-theme="theme-light">Light</button>
        <button class="theme-opt" data-theme="theme-sepia">Sepia</button>
      </div>
      <div class="settings-heading">Accent Color</div>
      <div id="accent-options">
        <button class="accent-opt" data-accent="blue"     style="--c:#7cb8f0" title="Blue"></button>
        <button class="accent-opt" data-accent="steel"    style="--c:#90aac8" title="Steel"></button>
        <button class="accent-opt" data-accent="sky"      style="--c:#80d0e8" title="Sky"></button>
        <button class="accent-opt" data-accent="sage"     style="--c:#90c8a0" title="Sage"></button>
        <button class="accent-opt" data-accent="mint"     style="--c:#80e0c0" title="Mint"></button>
        <button class="accent-opt" data-accent="olive"    style="--c:#b0c880" title="Olive"></button>
        <button class="accent-opt" data-accent="rose"     style="--c:#f0a0b0" title="Rose"></button>
        <button class="accent-opt" data-accent="coral"    style="--c:#f0907a" title="Coral"></button>
        <button class="accent-opt" data-accent="blush"    style="--c:#e8b0c8" title="Blush"></button>
        <button class="accent-opt" data-accent="lavender" style="--c:#b8a8f0" title="Lavender"></button>
        <button class="accent-opt" data-accent="mauve"    style="--c:#d0a0d0" title="Mauve"></button>
        <button class="accent-opt" data-accent="violet"   style="--c:#c0a0e8" title="Violet"></button>
        <button class="accent-opt" data-accent="peach"    style="--c:#f0b890" title="Peach"></button>
        <button class="accent-opt" data-accent="sand"     style="--c:#d4b896" title="Sand"></button>
        <button class="accent-opt" data-accent="amber"    style="--c:#e8c870" title="Amber"></button>
        <button class="accent-opt" data-accent="slate"    style="--c:#a0b8c8" title="Slate"></button>
      </div>
    </div>
  </div>

  <!-- Quick open / welcome overlay -->
  <div id="quick-open" class="hidden">
    <div id="quick-open-box">
      <div id="quick-open-actions">
        <button class="qa-btn" data-action="new">
          <span class="qa-label">New File</span>
          <span class="qa-shortcut">Ctrl+N</span>
        </button>
        <button class="qa-btn" data-action="open">
          <span class="qa-label">Open File</span>
          <span class="qa-shortcut">Ctrl+O</span>
        </button>
      </div>
      <div id="quick-open-recents">
        <div id="recents-label">Recent Files</div>
        <ul id="recents-list"></ul>
        <div id="recents-empty" class="hidden">No recent files</div>
      </div>
    </div>
  </div>

  <div id="editor-wrap">
    <div id="welcome">
      <div id="welcome-inner">
        <div id="welcome-logo">FlowMark</div>
        <div id="welcome-actions">
          <button class="wa-btn" data-action="new">
            <span class="wa-label">New File</span>
            <span class="wa-shortcut">Ctrl+N</span>
          </button>
          <button class="wa-btn" data-action="open">
            <span class="wa-label">Open File</span>
            <span class="wa-shortcut">Ctrl+O</span>
          </button>
        </div>
        <div id="welcome-recents">
          <div class="recents-heading">Recent</div>
          <ul id="welcome-recents-list"></ul>
          <div id="welcome-recents-empty" class="hidden">No recent files</div>
        </div>
      </div>
    </div>
    <div id="editor"></div>
  </div>
  <div id="statusbar">
    <span id="word-count"></span>
  </div>

  <script src="editor.bundle.js"></script>
</body>
</html>
